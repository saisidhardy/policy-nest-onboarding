# Production Compose overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Include reverse proxy with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile with-proxy up -d --build

services:
  db:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mailpit:
    profiles:
      - dev-only

  backend:
    environment:
      APP_ENV: production
      TRUST_PROXY_HEADERS: "true"
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'",
      ]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27-alpine
    profiles:
      - with-proxy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
